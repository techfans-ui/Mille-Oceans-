services:
  - type: web
    name: mille-oceans
    runtime: python
    buildCommand: pip install -r requirements.txt -r requirements-prod.txt && flask init-db && flask seed-db
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app.py
      - key: PYTHON_VERSION
        value: "3.11"
