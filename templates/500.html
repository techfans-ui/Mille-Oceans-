<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Erreur serveur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #8b0000, #dc3545); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: #fff; border-radius: 1rem; padding: 3rem; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.2); max-width: 480px; }
        .error-code { font-size: 5rem; font-weight: 800; color: #dc3545; line-height: 1; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">500</div>
        <h4 class="mt-3 mb-2">Erreur interne du serveur</h4>
        <p class="text-muted">Une erreur inattendue s'est produite. Notre équipe a été notifiée.</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a href="{{ url_for('dashboard') }}" class="btn btn-danger"><i class="bi bi-house"></i> Tableau de bord</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Retour</a>
        </div>
    </div>
</body>
</html>
