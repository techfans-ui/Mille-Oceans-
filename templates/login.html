{% extends "base.html" %}
{% block title %}Connexion — Mille Oceans{% endblock %}
{% block content_public %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#023e8a 0%,#0077b6 50%,#00b4d8 100%)">
    <div class="card shadow border-0" style="width:420px;max-width:95%">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-tsunami text-primary" style="font-size:2.5rem"></i>
                <h3 class="fw-bold mt-2 mb-0">Mille Oceans</h3>
                <p class="text-muted">Gestion des stocks de boissons</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="votre@email.com" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-box-arrow-in-right"></i> Se connecter
                </button>
            </form>
            <p class="text-center text-muted mt-3 mb-0">
                Pas de compte ? <a href="{{ url_for('register') }}">Créer un compte</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
