{% extends "base.html" %}
{% block title %}Inscription — Mille Oceans{% endblock %}
{% block content_public %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background:linear-gradient(135deg,#023e8a 0%,#0077b6 50%,#00b4d8 100%)">
    <div class="card shadow border-0" style="width:450px;max-width:95%">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-tsunami text-primary" style="font-size:2.5rem"></i>
                <h3 class="fw-bold mt-2 mb-0">Créer un compte</h3>
                <p class="text-muted">Rejoignez l'équipe Mille Oceans</p>
            </div>
            <form method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Prénom</label>
                        <input type="text" name="prenom" class="form-control" placeholder="Jean" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Nom</label>
                        <input type="text" name="nom" class="form-control" placeholder="Dupont" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control" placeholder="jdupont" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="votre@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Mot de passe</label>
                    <input type="password" name="password" class="form-control" placeholder="6 caractères minimum" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 btn-lg">
                    <i class="bi bi-person-plus"></i> Créer le compte
                </button>
            </form>
            <p class="text-center text-muted mt-3 mb-0">
                Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
